<!-- App Header -->
<ion-header>
  <nv-search-toolbar
    (onSearch)="onItemSearched($event)"
    (onFilter)="onFilter($event)">
  </nv-search-toolbar>
</ion-header>

<!-- App Content -->
<ion-content
  id="main-content"
  [fullscreen]="true">

      <!-- Add Disease Button -->
  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="onAddDisease()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  @for(element of $collection; track element) {


    <dc-card-diseases
      [inputTitle]    = "element?.title"
      [inputSubTitle] = "element?.type"
      [object]        = "element"
      (onSelectCard)  = "onSelectCard($event)">
    </dc-card-diseases>
  }

</ion-content>
