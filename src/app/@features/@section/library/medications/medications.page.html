<!-- App Header -->
<ion-header>
  <nv-search-toolbar
    (onSearch)      = "onItemSearched($event)"
    (onFilter)      = "onFilter($event)">
  </nv-search-toolbar>
</ion-header>

<!-- App Content -->
<ion-content
  id            = "main-content"
  [fullscreen]  = "true">

    <!-- Add Medication Button -->
  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="onAddMedication()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  @for(element of $collection; track element) {

    <dc-card
      [inputTitle]    = "element?.title"
      [inputSubTitle] = "element?.activeSubstance"
      [object]        = "element"
      (onSelectCard)  = "onSelectCard($event)">
    </dc-card>
  }

</ion-content>
